name: Tabella RT 6S (LUT)

# Calcolo una tantum (o dopo modifiche) della tabella di trasferimento radiativo 6S.
#   set = s2     -> 13 bande Sentinel-2
#   set = hyper  -> 400-2500 nm ogni 10 nm (211 lunghezze d'onda), diviso su 6 macchine in parallelo (~1 ora)
on:
  workflow_dispatch:
    inputs:
      set:
        description: "s2 oppure hyper"
        default: hyper
        required: true

permissions:
  contents: write

jobs:
  lut:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: rt
          create-args: python=3.12 sixs py6s numpy
          init-shell: bash
      - name: LUT 6S (parte ${{ matrix.part }})
        shell: bash -el {0}
        run: |
          if [ "${{ inputs.set }}" = "hyper" ]; then P="--part ${{ matrix.part }} --nparts 6"; else [ "${{ matrix.part }}" = "0" ] || exit 0; P=""; fi
          SIXS_PATH=$(which sixs) python -u scripts/01_build_rt_lut.py --set ${{ inputs.set }} --jobs 4 $P
      - uses: actions/upload-artifact@v4
        with:
          name: lut-${{ matrix.part }}
          path: data/rt/lut_*.json
          if-no-files-found: ignore

  save:
    needs: lut
    runs-on: ubuntu-latest
    concurrency:
      group: data-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: data/rt/parts
      - name: Unisci e salva
        run: |
          if [ "${{ inputs.set }}" = "hyper" ]; then python scripts/01b_merge_lut.py hyper; else cp data/rt/parts/*/lut_s2.json data/rt/; fi
          rm -rf data/rt/parts
          git config user.name "torricelli-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rt
          git commit -m "LUT 6S ${{ inputs.set }}" || exit 0
          git pull --rebase origin main && git push
