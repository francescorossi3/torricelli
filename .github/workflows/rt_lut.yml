name: Tabella RT 6S (LUT)

# Calcolo una tantum (o dopo modifiche) della tabella di trasferimento radiativo 6S.
#   set = s2     -> 13 bande Sentinel-2 (circa 10 min)
#   set = hyper  -> 400-2500 nm ogni 20 nm, 106 bande (circa 1-2 ore)
on:
  workflow_dispatch:
    inputs:
      set:
        description: "s2 oppure hyper"
        default: hyper
        required: true

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  lut:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: rt
          create-args: python=3.12 sixs py6s numpy pyyaml
          init-shell: bash
      - name: LUT 6S
        shell: bash -el {0}
        run: SIXS_PATH=$(which sixs) python -u scripts/01_build_rt_lut.py --set ${{ inputs.set }} --jobs 4
      - name: Salva nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rt
          git commit -m "LUT 6S ${{ inputs.set }}" || exit 0
          git pull --rebase origin main && git push
