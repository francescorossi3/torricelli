name: Misure di validazione e regression kriging (AERONET + GNSS + Sentinel-2)

on:
  schedule:
    - cron: "23 9 * * *"        # ogni giorno alle 09:23 UTC (dopo l'aggiornamento giornaliero)
  workflow_dispatch:
    inputs:
      start:
        description: "Primo giorno AAAA-MM-GG (vuoto = ultimi 7 giorni)"
        required: false
      end:
        description: "Ultimo giorno AAAA-MM-GG (vuoto = oggi)"
        required: false

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  obs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      USER_AGENT: "torricelli github.com/${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: AERONET (AOD 550 nm e vapore acqueo, tutti i siti)
        run: python -u scripts/04_fetch_aeronet.py ${{ inputs.start && format('--start {0}', inputs.start) || '' }} ${{ inputs.end && format('--end {0}', inputs.end) || '' }}
      - name: GNSS (vapore acqueo, Nevada Geodetic Laboratory)
        run: python -u scripts/04b_fetch_gnss.py ${{ inputs.start && format('--start {0}', inputs.start) || '' }} ${{ inputs.end && format('--end {0}', inputs.end) || '' }}
      - name: Valori dei modelli (ECMWF, CAMS) nei siti AERONET
        run: python -u scripts/05_model_at_aeronet.py ${{ inputs.start && format('--start {0}', inputs.start) || '' }} ${{ inputs.end && format('--end {0}', inputs.end) || '' }}
      - name: Covariate Sentinel-2 e terreno nei siti
        run: python -u scripts/06_covariates_s2.py ${{ inputs.start && format('--start {0}', inputs.start) || '' }} ${{ inputs.end && format('--end {0}', inputs.end) || '' }}
      - name: Regression kriging (RF, HGB) validato sito per sito
        run: python -u scripts/07_rk_validate.py
      - name: Salva i dati
        run: |
          git config user.name "torricelli-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "Misure e validazione RK $(date -u +%F)" || echo "niente da salvare"
          git pull --rebase origin main && git push
